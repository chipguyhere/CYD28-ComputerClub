# ESP Launchpad (minimal) configuration for the club firmware, generated by
# build.sh from release/launchpad.toml.in.  Open it with:
#   https://espressif.github.io/esp-launchpad/minimal-launchpad/?flashConfigURL=<this file's raw URL>
# Every URL here must send CORS headers: raw.githubusercontent.com does,
# GitHub release downloads don't.
esp_toml_version = 1.0
supported_apps = ["CYD 2.8in Computer Club"]
multipart = true
chip = "esp32"

["CYD 2.8in Computer Club"]
readme.text = "https://raw.githubusercontent.com/chipguyhere/CYD28-ComputerClub/main/README.md"
console_baudrate = 115200
# The whole 4 MB flash: firmware plus a filesystem that makes the board ask
# which board it is.  The launchpad erases the chip first anyway.
image.esp32.parts = ["https://raw.githubusercontent.com/chipguyhere/CYD28-ComputerClub/main/cyd28-computerclub.bin"]
image.esp32.addresses = ["0x0"]
